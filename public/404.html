<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Saurabh Sharma Portfolio</title>
    <meta
      name="description"
      content="The page you are looking for does not exist. Return to the homepage of Saurabh Sharma — Full Stack MERN Developer."
    />
    <link rel="canonical" href="https://saurabhsharma.is-a.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Roboto, Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 560px; }
      .code {
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 700;
        line-height: 1;
        color: #eab308;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin: 24px 0 12px;
      }
      p { color: #aaa; line-height: 1.7; margin-bottom: 28px; }
      a {
        display: inline-block;
        padding: 14px 32px;
        border: 1px solid #fff;
        border-radius: 999px;
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-size: 0.85rem;
        transition: all 0.3s ease;
      }
      a:hover { background: #fff; color: #000; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>
        The page you are looking for does not exist or has been moved.
        Head back to the homepage to explore projects, experience and contact details.
      </p>
      <a href="/">Back to Homepage</a>
    </main>
